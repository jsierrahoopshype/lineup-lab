<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Headshot styles test | HoopsMatic</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--border:#d1d1d6;--text:#1d1d1f;--muted:#6e6e73}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:1rem 16px 3rem}
h1{font-size:1.15rem;margin-bottom:.3rem}
p.lead{font-size:.85rem;color:var(--muted);margin-bottom:1.2rem}
section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem .9rem;margin-bottom:1rem}
h2{font-size:1rem;margin-bottom:.15rem}
h2 b{display:inline-block;background:#3b82f6;color:#fff;border-radius:6px;padding:0 .45rem;margin-right:.4rem}
.why{font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.size{font-size:.72rem;color:var(--muted);margin:.4rem 0 .3rem}
.row{display:flex;flex-wrap:wrap;gap:.55rem .45rem}
.p{display:flex;flex-direction:column;align-items:center;width:64px;font-size:.66rem;text-align:center;line-height:1.2}
.p.big{width:84px}
.p span{margin-top:.25rem;overflow-wrap:anywhere}
/* A: what is live now */
.a img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.big.a img{width:64px;height:64px}
/* B: cutout on a light circle, anchored to the top, zoomed so the head fills it */
.b .f{width:40px;height:40px;border-radius:50%;background:#e8e8ed;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.big.b .f{width:64px;height:64px}
.b .f img{width:135%;height:auto;flex-shrink:0;margin-bottom:-12%}
/* C: cutout in a light rounded rectangle, head and shoulders (NBA.com style) */
.c .f{width:52px;height:40px;border-radius:8px;background:#e8e8ed;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.big.c .f{width:80px;height:60px}
.c .f img{width:100%;height:auto;flex-shrink:0}
/* D: tight cutout (face-tight) on a light circle */
.d .f{width:40px;height:40px;border-radius:50%;background:#e8e8ed;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.big.d .f{width:64px;height:64px}
.d .f img{width:100%;height:100%;object-fit:contain;object-position:center bottom}
/* initials, for players with no photo */
.ini{display:flex;align-items:center;justify-content:center;font-weight:700;color:#55555c;font-size:.8rem}
.big .ini{font-size:1.15rem}
</style>
</head>
<body>
<div class="wrap">
<h1>Headshot styles: pick one</h1>
<p class="lead">The same 12 players in four styles, at the small size the cards use and a bigger size. The last player (Rick Fox) has no photo, so he shows what the initials fallback looks like. Check it on your phone too.</p>
<div id="out"></div>
</div>
<script>
var HS = 'https://jsierrahoopshype.github.io/nba-headshots/players/headshots/';
var P = [
  ['2544-lebron-james','LeBron James'],['203999-nikola-joki','Nikola Jokić'],['1628983-shai-gilgeous-alexander','Shai Gilgeous-Alexander'],
  ['1641705-victor-wembanyama','Victor Wembanyama'],['201939-stephen-curry','Stephen Curry'],['1642843-cooper-flagg','Cooper Flagg'],
  ['977-kobe-bryant','Kobe Bryant'],['1495-tim-duncan','Tim Duncan'],['2037-allen-iverson','Allen Iverson'],
  ['1717-dirk-nowitzki','Dirk Nowitzki'],['304-john-stockton','John Stockton'],[null,'Rick Fox']
];
var S = [
  ['a','A','What is live now','Uniform framing, but dark baked-in backgrounds and the black band at the bottom you spotted.', function(s){return HS+'face2-160/'+s+'.webp';}],
  ['b','B','Cutout on a light circle','The see-through photo on light grey, anchored to the bottom so shoulders fill the circle and no chin is cut.', function(s){return HS+'face/'+s+'.png';}],
  ['c','C','Cutout in a light rectangle','Head and shoulders, the way NBA.com shows players. Slightly wider, so five per row still fit on a phone.', function(s){return HS+'face/'+s+'.png';}],
  ['d','D','Tight cutout on a light circle','The tight crop (face-tight). Smaller files, but how much of the face fills the circle varies by photo.', function(s){return HS+'face-tight/'+s+'.webp';}]
];
function ini(n){var w=n.split(' ');return (w[0][0]+(w[w.length-1][0]||'')).toUpperCase();}
var out='';
S.forEach(function(st){
  out+='<section><h2><b>'+st[1]+'</b>'+st[2]+'</h2><p class="why">'+st[3]+'</p>';
  [['','Card size'],['big','Bigger size']].forEach(function(sz){
    out+='<p class="size">'+sz[1]+'</p><div class="row">';
    P.forEach(function(p){
      var cls='p '+sz[0]+' '+st[0];
      var img;
      if(!p[0]){img='<div class="f ini" style="'+(st[0]==='a'?'width:'+(sz[0]?64:40)+'px;height:'+(sz[0]?64:40)+'px;border-radius:50%;background:#e8e8ed':'')+'">'+ini(p[1])+'</div>';}
      else if(st[0]==='a'){img='<img src="'+st[4](p[0])+'" alt="" loading="lazy">';}
      else{img='<div class="f"><img src="'+st[4](p[0])+'" alt="" loading="lazy"></div>';}
      out+='<div class="'+cls+'">'+img+'<span>'+p[1].split(' ').slice(-1)[0]+'</span></div>';
    });
    out+='</div>';
  });
  out+='</section>';
});
document.getElementById('out').innerHTML=out;
</script>
</body>
</html>
