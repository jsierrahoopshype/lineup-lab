# TEMPORARY: one run on this branch to see Wikidata's height coverage. Deleted before merge.
name: Heights probe
on:
  push:
    branches: [heights-min100]
    paths: ['.github/workflows/heights-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build/lineup_lab_heights.py
      - run: |
          git add data/heights.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Heights probe result"
          git push
