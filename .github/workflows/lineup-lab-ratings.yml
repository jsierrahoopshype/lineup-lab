# Global Rating+ and Real Value for the Trade Machine (hoopsmatic.com/):
# docs/data/ratings-<YYYY>.json, served at /lineups/data/ratings-<YYYY>.json.
#
# Every 3 hours, on "Run workflow" and on pushes that change the script.
# build/lineup_lab_ratings.mjs runs Alberto's CURRENT page code (aderoa/
# RealValue) on the same public data files his pages read, so a formula
# change is in the file at the next run. If his code can't be found or a
# measure comes back thin, the run fails (GitHub emails) and the previous file
# stays; the Trade Machine then works the numbers out in the visitor's browser
# as before, once the file is over 36 hours old.
#
# That step runs code fetched from another repo, so it gets no credentials:
# the checkout keeps none, and only the commit step is given the token.
name: Lineup Lab ratings

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/lineup_lab_ratings.mjs'
      - 'tests/ratings.test.mjs'
      - '.github/workflows/lineup-lab-ratings.yml'

permissions:
  contents: write

# Its own group: sharing the nightly's would let a queued ratings run cancel a
# queued nightly. The two write different files; the push below rebases and
# retries if the nightly pushed first.
concurrency:
  group: lineup-lab-ratings
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test tests/ratings.test.mjs

      - name: Compute (no credentials)
        run: node build/lineup_lab_ratings.mjs

      - name: Commit if the numbers changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/data/ratings-*.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Ratings update $(date -u '+%F %H:%M UTC')"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
